<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0C0C0F; --surface: #16161A; --surface2: #1E1E24;
  --border: #2A2A32; --text: #F0F0F0; --muted: #666; --dim: #444;
  --teal: #4ECDC4; --red: #FF6B6B; --yellow: #FFE66D;
}
body { font-family: 'IBM Plex Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }
.screen { display: none; }
.screen.active { display: flex; }

/* ── SHARED ── */
.field { width: 100%; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 14px 18px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.7; outline: none; transition: border-color 0.2s; resize: none; }
.field:focus { border-color: var(--teal); }
.field::placeholder { color: #3A3A44; }
.teal-btn { background: var(--teal); color: #0C0C0F; border: none; padding: 12px 28px; font-family: 'Archivo Black', sans-serif; font-size: 14px; letter-spacing: 0.05em; border-radius: 10px; cursor: pointer; transition: transform 0.15s, opacity 0.2s; white-space: nowrap; }
.teal-btn:hover:not(:disabled) { transform: translateY(-2px); }
.teal-btn:disabled { opacity: 0.28; cursor: not-allowed; }
.ghost-btn { background: none; border: 1.5px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.error-box { background: #1A0F0F; border: 1.5px solid #FF6B6B44; border-radius: 10px; padding: 12px 16px; margin-top: 12px; display: none; }
.error-box.visible { display: block; }
.error-box p { color: var(--red); font-size: 12px; line-height: 1.5; }
.error-detail { color: #FF6B6B44 !important; font-size: 11px !important; margin-top: 4px !important; word-break: break-all; }

/* ── SYNC STATUS ── */
.sync-dot {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--dim); letter-spacing: 0.04em;
}
.sync-dot::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim); flex-shrink: 0; transition: background 0.3s;
}
.sync-dot.syncing::before { background: var(--yellow); animation: pulse-dot 0.8s ease-in-out infinite; }
.sync-dot.synced::before  { background: var(--teal); }
.sync-dot.error::before   { background: var(--red); }
@keyframes pulse-dot { 0%,100%{opacity:0.4} 50%{opacity:1} }

/* ── INPUT ── */
#screen-input { flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px; }
.input-header { text-align: center; margin-bottom: 32px; }
.input-header .logo { font-size: 40px; display: block; margin-bottom: 10px; }
.input-header h1 { font-family: 'Archivo Black', sans-serif; font-size: clamp(26px, 5vw, 46px); letter-spacing: -0.03em; line-height: 1.05; margin-bottom: 10px; }
.input-header h1 span { color: var(--teal); }
.input-header p { color: var(--muted); font-size: 12.5px; line-height: 1.6; max-width: 420px; margin: 0 auto; }
.input-wrap { width: 100%; max-width: 660px; }
.key-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
.key-input { flex: 1; background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 11px 16px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; outline: none; transition: border-color 0.2s; }
.key-input:focus { border-color: var(--teal); }
.key-input::placeholder { color: #3A3A44; }
.key-link { color: var(--dim); font-size: 11px; white-space: nowrap; text-decoration: none; transition: color 0.2s; }
.key-link:hover { color: var(--teal); }
.notice-box { border-radius: 10px; padding: 13px 17px; margin-bottom: 12px; font-size: 12px; line-height: 1.6; }
.notice-carryover { background: #0D1A19; border: 1.5px solid #4ECDC433; color: var(--muted); }
.notice-carryover strong { color: var(--teal); }
.input-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.line-count { color: var(--dim); font-size: 11px; }
.sample-btn { background: none; border: 1.5px solid var(--border); color: var(--muted); padding: 9px 14px; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; cursor: pointer; transition: all 0.2s; }
.sample-btn:hover { border-color: var(--teal); color: var(--teal); }

/* ── LOADING ── */
#screen-loading { flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 24px; }
.loader-ring { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.load-msg { font-size: 13px; color: var(--muted); animation: blink 1.8s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

/* ── BOARD ── */
#screen-board { flex-direction: column; min-height: 100vh; }
.board-topbar { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); padding: 13px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topbar-left { display: flex; flex-direction: column; gap: 3px; }
.topbar-date { font-family: 'Archivo Black', sans-serif; font-size: 16px; }
.topbar-date .today-tag { color: var(--teal); margin-right: 8px; }
.topbar-meta { font-size: 11px; color: var(--dim); }
.topbar-right { display: flex; gap: 10px; align-items: center; }
.board-body { max-width: 860px; margin: 0 auto; width: 100%; padding: 24px 24px 140px; }
.progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.progress-wrap { flex: 1; background: var(--surface2); border-radius: 4px; height: 5px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--yellow)); border-radius: 4px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); width: 0%; }
.progress-label { font-size: 11px; color: var(--dim); white-space: nowrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.pill { padding: 5px 12px; border-radius: 20px; font-family: 'Archivo Black', sans-serif; font-size: 10px; letter-spacing: 0.07em; cursor: pointer; border: 2px solid; transition: all 0.18s; background: transparent; }
.cat-section { margin-bottom: 32px; border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color 0.2s; }
.cat-section.drag-over { border-color: var(--teal); background: #0D1A19; }
.cat-section.drag-over .drop-hint { opacity: 1; height: auto; }
.cat-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.cat-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; cursor: pointer; transition: transform 0.15s; }
.cat-dot:hover { transform: scale(1.4); }
.cat-name-display { font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.1em; cursor: pointer; flex: 1; transition: opacity 0.15s; }
.cat-name-display:hover { opacity: 0.7; }
.cat-name-input { font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.1em; background: transparent; border: none; border-bottom: 1.5px solid; outline: none; color: inherit; flex: 1; padding: 1px 0; display: none; }
.cat-name-input.editing { display: block; }
.cat-name-display.editing { display: none; }
.cat-count { font-size: 10px; color: var(--dim); white-space: nowrap; }
.cat-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.cat-header:hover .cat-actions { opacity: 1; }
.cat-action-btn { background: none; border: none; cursor: pointer; color: var(--dim); font-size: 13px; padding: 2px 5px; border-radius: 4px; transition: color 0.15s, background 0.15s; line-height: 1; }
.cat-action-btn:hover { color: var(--text); background: var(--border); }
.cat-action-btn.delete-cat:hover { color: var(--red); background: #1A0F0F; }
.task-list { padding: 6px; display: flex; flex-direction: column; gap: 5px; min-height: 44px; }
.drop-hint { font-size: 11px; color: var(--teal); text-align: center; padding: 6px; opacity: 0; height: 0; overflow: hidden; transition: opacity 0.2s, height 0.2s; pointer-events: none; }
.task-card { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 9px; padding: 11px 14px; cursor: grab; transition: border-color 0.2s, transform 0.12s, background 0.2s, opacity 0.2s; user-select: none; animation: slideIn 0.2s ease both; position: relative; }
@keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.task-card:hover { border-color: #444; }
.task-card.done { background: #0F0F12; border-color: #1C1C22; }
.task-card.done .task-text { opacity: 0.22; text-decoration: line-through; }
.task-card.carried { border-left: 3px solid #4ECDC455; }
.task-card.dragging { opacity: 0.3; cursor: grabbing; transform: scale(0.97); }
.task-card.drag-ghost { opacity: 0.85; transform: rotate(1.5deg) scale(1.03); box-shadow: 0 8px 30px rgba(0,0,0,0.5); cursor: grabbing; pointer-events: none; }
.drag-handle { color: #333; font-size: 12px; cursor: grab; flex-shrink: 0; line-height: 1; padding: 2px 0; transition: color 0.15s; }
.task-card:hover .drag-handle { color: #555; }
.checkbox { width: 18px; height: 18px; border-radius: 5px; border: 2px solid; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; transition: background 0.2s, transform 0.12s; cursor: pointer; }
.task-card:hover .checkbox:not(.checked) { transform: scale(1.1); }
.task-text { font-size: 12.5px; line-height: 1.4; flex: 1; }
.carried-tag { display: inline-flex; background: #4ECDC411; border: 1px solid #4ECDC433; border-radius: 4px; padding: 1px 5px; font-size: 9px; color: var(--teal); margin-left: 6px; vertical-align: middle; }
.task-delete { background: none; border: none; cursor: pointer; color: transparent; font-size: 13px; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; transition: color 0.15s, background 0.15s; line-height: 1; }
.task-card:hover .task-delete { color: #444; }
.task-card:hover .task-delete:hover { color: var(--red); background: #1A0F0F; }
.add-cat-row { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
.add-cat-input { flex: 1; background: var(--surface); border: 1.5px dashed var(--border); border-radius: 10px; padding: 10px 16px; color: var(--text); font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.07em; outline: none; transition: border-color 0.2s; }
.add-cat-input:focus { border-color: var(--teal); border-style: solid; }
.add-cat-input::placeholder { color: #2A2A32; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0; }
.add-cat-btn { background: none; border: 1.5px solid var(--border); color: var(--muted); padding: 9px 16px; border-radius: 8px; font-family: 'Archivo Black', sans-serif; font-size: 11px; letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.add-cat-btn:hover { border-color: var(--teal); color: var(--teal); }
.add-more-panel { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 4px; }
.add-more-label { font-family: 'Archivo Black', sans-serif; font-size: 10px; letter-spacing: 0.08em; color: var(--dim); margin-bottom: 12px; }
.add-more-row { display: flex; gap: 10px; align-items: flex-end; }
.add-more-row textarea { flex: 1; min-height: 76px; border-radius: 8px; font-size: 12.5px; padding: 11px 13px; }
.done-banner { text-align: center; padding: 44px 20px 12px; display: none; }
.done-banner.visible { display: block; }
.done-banner .big-emoji { font-size: 50px; margin-bottom: 12px; animation: pop 0.5s ease; }
@keyframes pop { 0%{transform:scale(0.5)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.done-banner h2 { font-family: 'Archivo Black', sans-serif; font-size: 24px; margin-bottom: 5px; }
.done-banner p { color: var(--muted); font-size: 12px; }

/* ── HISTORY ── */
#screen-history { flex-direction: column; min-height: 100vh; padding: 32px 24px 80px; }
.history-inner { max-width: 740px; margin: 0 auto; width: 100%; }
.history-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; gap: 12px; }
.history-topbar h2 { font-family: 'Archivo Black', sans-serif; font-size: 22px; letter-spacing: -0.02em; }
.day-entry { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 15px 18px; margin-bottom: 10px; }
.day-entry-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.day-entry-date { font-family: 'Archivo Black', sans-serif; font-size: 13px; }
.day-entry-stats { font-size: 11px; color: var(--dim); }
.day-task { font-size: 11.5px; color: var(--muted); padding: 3px 0; display: flex; align-items: center; gap: 7px; }
.day-task.done-task { text-decoration: line-through; opacity: 0.35; }
.dt-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.done-task .dt-dot { background: var(--teal); }
.no-history { color: var(--muted); font-size: 13px; text-align: center; padding: 60px 0; }

/* ── COLOR PICKER ── */
.color-popup { position: fixed; z-index: 9999; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; display: flex; gap: 7px; flex-wrap: wrap; width: 156px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
.color-swatch { width: 24px; height: 24px; border-radius: 5px; cursor: pointer; transition: transform 0.15s; border: 2px solid transparent; }
.color-swatch:hover { transform: scale(1.2); }
.color-swatch.active { border-color: white; }

/* ── PARTICLES ── */
.particle { position: fixed; pointer-events: none; border-radius: 50%; z-index: 9999; animation: particle-fly 0.55s ease-out forwards; }
@keyframes particle-fly {
  0%   { transform: translate(0,0) scale(1); opacity: 1; }
  70%  { opacity: 0.8; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}
@keyframes cat-complete-glow {
  0%   { box-shadow: 0 0 0px 0px var(--glow-color); background: var(--surface2); }
  30%  { box-shadow: 0 0 24px 6px var(--glow-color); background: var(--flash-color); }
  100% { box-shadow: 0 0 0px 0px var(--glow-color); background: var(--surface2); }
}
@keyframes cat-label-pop  { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }
@keyframes streak-fly     { 0%{transform:translate(0,0) scaleX(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scaleX(0.2);opacity:0} }
@keyframes task-complete  { 0%{opacity:1} 100%{opacity:0.25} }
@keyframes uncheck-pop    { 0%{transform:scale(0.8)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
@keyframes checkmark-pop  { 0%{transform:scale(0.3) rotate(-10deg)} 60%{transform:scale(1.2) rotate(3deg)} 100%{transform:scale(1) rotate(0deg)} }
</style>
</head>
<body>

<!-- INPUT -->
<div id="screen-input" class="screen active">
  <div class="input-header">
    <span class="logo">🗂</span>
    <h1>PASTE YOUR <span>CHAOS</span></h1>
    <p>Paste today's tasks. Unfinished items carry over automatically. Syncs across all your devices.</p>
  </div>
  <div class="input-wrap">
    <div id="input-notices"></div>
    <div class="key-row">
      <input class="key-input" id="api-key" type="password" placeholder="sk-ant-... (Anthropic API key)" spellcheck="false" autocomplete="off" />
      <a class="key-link" href="https://console.anthropic.com/settings/keys" target="_blank">get key ↗</a>
    </div>
    <div class="key-row" style="margin-bottom:14px">
      <input class="key-input" id="github-pat" type="password" placeholder="ghp_... (GitHub PAT for sync across devices)" spellcheck="false" autocomplete="off" />
      <a class="key-link" href="https://github.com/settings/tokens/new?scopes=gist&description=DailyTaskBoard" target="_blank">get PAT ↗</a>
    </div>
    <textarea id="raw-input" class="field" style="min-height:190px;margin-bottom:0"
      placeholder="Paste today's notes, Notion dump, meeting action items..."></textarea>
    <div class="input-footer">
      <span class="line-count" id="line-count">0 lines</span>
      <button class="sample-btn" onclick="loadSample()">load sample ↗</button>
      <button class="teal-btn" id="go-btn" disabled onclick="startParse()">ORGANIZE IT →</button>
    </div>
    <div class="error-box" id="input-error">
      <p id="input-error-msg">Something went wrong.</p>
      <p class="error-detail" id="input-error-detail"></p>
    </div>
  </div>
</div>

<!-- LOADING -->
<div id="screen-loading" class="screen">
  <div class="loader-ring"></div>
  <p class="load-msg" id="load-msg">Parsing your chaos...</p>
</div>

<!-- BOARD -->
<div id="screen-board" class="screen">
  <div class="board-topbar">
    <div class="topbar-left">
      <div class="topbar-date" id="board-date-label"></div>
      <div class="topbar-meta" id="board-meta"></div>
    </div>
    <div class="topbar-right">
      <span class="sync-dot" id="sync-dot">synced</span>
      <button class="ghost-btn" style="border-color:var(--teal);color:var(--teal)" onclick="showHistory()">📅 History</button>
    </div>
  </div>
  <div class="board-body">
    <div class="progress-row">
      <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0 / 0</span>
    </div>
    <div class="filters" id="filter-pills"></div>
    <div id="board-content"></div>
    <div class="add-cat-row">
      <input class="add-cat-input" id="new-cat-input" placeholder="+ new category name" maxlength="40"
        onkeydown="if(event.key==='Enter')addNewCategory()" />
      <button class="add-cat-btn" onclick="addNewCategory()">ADD CATEGORY</button>
    </div>
    <div class="done-banner" id="done-banner">
      <div class="big-emoji">🎉</div>
      <h2>ALL DONE!</h2>
      <p>You absolute machine.</p>
    </div>
    <div class="add-more-panel">
      <div class="add-more-label">ADD MORE TASKS</div>
      <div class="add-more-row">
        <textarea id="add-more-input" class="field"
          placeholder="Paste more notes mid-day — AI parses and merges, no duplicates..."
          oninput="document.getElementById('add-btn').disabled=!this.value.trim()"></textarea>
        <button class="teal-btn" id="add-btn" style="padding:12px 20px" disabled onclick="addMoreTasks()">ADD →</button>
      </div>
      <div class="error-box" id="add-error">
        <p id="add-error-msg">Failed to add.</p>
        <p class="error-detail" id="add-error-detail"></p>
      </div>
    </div>
  </div>
</div>

<!-- HISTORY -->
<div id="screen-history" class="screen">
  <div class="history-inner">
    <div class="history-topbar">
      <h2>📅 HISTORY</h2>
      <button class="ghost-btn" onclick="show('board')">← back</button>
    </div>
    <div id="history-content"></div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
//  CONSTANTS
// ──────────────────────────────────────────────
const COLORS = ["#FF6B6B","#4ECDC4","#FFE66D","#B5EAD7","#FFDAC1","#C7CEEA","#A8E6CF","#FF9AA2","#F8B4D9","#B5B9FF"];
const MSGS   = ["Parsing your chaos...","Wrangling duplicates...","Finding patterns...","Building categories...","Almost there..."];
const SAMPLE = `Weekly sync notes

Action items:
- finalize exec deck for Thursday review
- send updated roadmap to stakeholders by EOW
- follow up with design on onboarding flow mockups
- confirm sprint timeline with engineering
- research competitor pricing (Notion, Linear, Asana)
- set up weekly 1:1s with new direct reports
- draft Q1 product update blog post
- update roadmap deck
- sync with marketing on launch copy
- review PRD for search feature before Thursday
- submit expense report for last month
- book flights for NYC summit
- reply to Ana's email re: panel session
- review Ana's PR on the API refactor
- update onboarding docs for new hires`;

// ──────────────────────────────────────────────
//  DATE
// ──────────────────────────────────────────────
function todayKey() {
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
}
function fmtDate(key) {
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${DAYS[dt.getDay()]}, ${MONS[m-1]} ${d}`;
}

// ──────────────────────────────────────────────
//  LOCAL STORAGE
// ──────────────────────────────────────────────
function loadAll()     { try { return JSON.parse(localStorage.getItem('tboard')||'{}'); } catch(e){ return {}; } }
function saveLocal(d)  { localStorage.setItem('tboard', JSON.stringify(d)); }
function loadAntKey()  { try { return localStorage.getItem('ant_key')||''; } catch(e){ return ''; } }
function saveAntKey(k) { try { localStorage.setItem('ant_key', k); } catch(e){} }
function loadPAT()     { try { return localStorage.getItem('gh_pat')||''; } catch(e){ return ''; } }
function savePAT(k)    { try { localStorage.setItem('gh_pat', k); } catch(e){} }
function loadGistId()  { try { return localStorage.getItem('gist_id')||''; } catch(e){ return ''; } }
function saveGistId(id){ try { localStorage.setItem('gist_id', id); } catch(e){} }

// ──────────────────────────────────────────────
//  GIST SYNC
// ──────────────────────────────────────────────
const GIST_FILENAME = 'daily-task-board.json';
let syncTimer = null;
let syncPending = false;

function setSyncStatus(state, label) {
  const dot = document.getElementById('sync-dot');
  if (!dot) return;
  dot.className = 'sync-dot ' + state;
  dot.textContent = label;
}

async function gistRead(pat) {
  // Step 1: get or discover the Gist ID
  let gistId = loadGistId();

  if (!gistId) {
    // Phone doesn't have the ID yet — search the user's gists for our file
    try {
      for (let page = 1; page <= 5; page++) {
        const res = await fetch(`https://api.github.com/gists?per_page=20&page=${page}`, {
          headers: { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github+json' }
        });
        if (!res.ok) break;
        const list = await res.json();
        if (!Array.isArray(list) || !list.length) break;
        const found = list.find(g => g.files?.[GIST_FILENAME]);
        if (found) { gistId = found.id; saveGistId(gistId); break; }
        if (list.length < 20) break;
      }
    } catch(e) { /* fall through */ }
  }

  if (!gistId) return null;

  // Step 2: fetch the Gist content
  try {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) return null;
    const data    = await res.json();
    const content = data.files?.[GIST_FILENAME]?.content;
    if (!content) return null;
    return JSON.parse(content);
  } catch(e) { return null; }
}

async function gistWrite(pat, boardData) {
  const content = JSON.stringify(boardData);
  let gistId = loadGistId();

  // If no ID cached, search existing Gists BEFORE creating a new one
  // This prevents duplicate Gists when opening on a new browser/device
  if (!gistId) {
    try {
      for (let page = 1; page <= 5; page++) {
        const r = await fetch(`https://api.github.com/gists?per_page=20&page=${page}`, {
          headers: { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github+json' }
        });
        if (!r.ok) break;
        const list = await r.json();
        if (!Array.isArray(list) || !list.length) break;
        const found = list.find(g => g.files?.[GIST_FILENAME]);
        if (found) { gistId = found.id; saveGistId(gistId); break; }
        if (list.length < 20) break;
      }
    } catch(e) { /* fall through to create */ }
  }

  if (!gistId) {
    // No existing Gist found — create one
    const res = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: { 'Authorization': `token ${pat}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({
        description: 'Daily Task Board data',
        public: false,
        files: { [GIST_FILENAME]: { content } }
      })
    });
    if (!res.ok) throw new Error(`Gist create failed: ${res.status}`);
    const data = await res.json();
    gistId = data.id;
    saveGistId(gistId);
  } else {
    // Update existing Gist
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH',
      headers: { 'Authorization': `token ${pat}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content } } })
    });
    if (!res.ok) throw new Error(`Gist update failed: ${res.status}`);
  }
}

// Debounced save: saves locally immediately, pushes to Gist after 2s idle
function saveAll(data) {
  saveLocal(data);
  const pat = loadPAT();
  if (!pat) return; // no sync without PAT

  setSyncStatus('syncing', 'syncing...');
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await gistWrite(pat, data);
      setSyncStatus('synced', 'synced ✓');
    } catch(e) {
      console.error('Gist sync error:', e);
      setSyncStatus('error', 'sync failed');
    }
  }, 2000);
}

(async function boot() {
  // Restore keys
  const antKey = loadAntKey();
  const pat    = loadPAT();
  if (antKey) document.getElementById('api-key').value = antKey;
  if (pat)    document.getElementById('github-pat').value = pat;

  // If PAT exists, always try Gist — even if we don't have the ID yet
  // (phone will search and discover the existing Gist)
  if (pat) {
    document.getElementById('load-msg').textContent = 'Loading your board...';
    show('loading');
    setSyncStatus('syncing', 'syncing...');
    const remote = await gistRead(pat);
    if (remote) {
      saveLocal(remote);
      setSyncStatus('synced', 'synced ✓');
    } else {
      setSyncStatus('error', 'sync failed');
    }
  }

  const days = loadAll();
  if (days[today]) {
    renderBoard(); show('board');
  } else {
    const co = getCarryoverTasks(days);
    if (co.length > 0) {
      // Auto-build today's board from carryover — no input needed
      const groups = {};
      co.forEach(t => {
        if (!groups[t.catName]) groups[t.catName] = { name: t.catName, color: t.catColor, items: [] };
        groups[t.catName].items.push({ text: t.text, carried: true });
      });
      const categories = Object.values(groups).map((g, i) => ({
        name: g.name, id: 'c'+i, color: g.color, tasks: g.items
      }));
      days[today] = { categories, done: [] };
      saveAll(days);
      renderBoard(); show('board');
    } else {
      // Truly empty — first time ever, show input
      renderInputNotices(days); show('input');
    }
  }
})();

// ──────────────────────────────────────────────
//  CARRYOVER
// ──────────────────────────────────────────────
function getCarryoverTasks(days) {
  const pastKeys = Object.keys(days).filter(k => k < today).sort();
  const seen = new Set(), result = [];
  pastKeys.forEach(dk => {
    const day = days[dk], doneSet = new Set(day.done||[]);
    (day.categories||[]).forEach(cat => {
      (cat.tasks||[]).forEach((t, ti) => {
        const text = typeof t==='string'?t:t.text, key = cat.id+'-'+ti, norm = text.toLowerCase().trim();
        if (!doneSet.has(key) && !seen.has(norm)) { seen.add(norm); result.push({text, catName:cat.name, catColor:cat.color}); }
      });
    });
  });
  return result;
}

// ──────────────────────────────────────────────
//  PARSE FLOW
// ──────────────────────────────────────────────
async function startParse() {
  const text = ta.value.trim(), apiKey = keyEl.value.trim();
  if (!text || !apiKey) return;
  const days = loadAll();
  if (days[today]) {
    show('board'); renderBoard();
    document.getElementById('add-more-input').value = text;
    document.getElementById('add-btn').disabled = false;
    ta.value = ''; document.getElementById('line-count').textContent = '0 lines';
    return;
  }
  show('loading');
  const result = await callClaude(apiKey, text);
  if (!result.ok) { showInputError(result.error); return; }

  let categories = result.categories.map((c, i) => ({
    name: c.name, id: 'c'+i, color: COLORS[i%COLORS.length],
    tasks: c.tasks.map(t => ({ text: t, carried: false }))
  }));

  const coTasks = getCarryoverTasks(days);
  if (coTasks.length) {
    const newTexts = new Set(categories.flatMap(c => c.tasks.map(t => t.text.toLowerCase().trim())));
    const fresh = coTasks.filter(t => !newTexts.has(t.text.toLowerCase().trim()));
    const groups = {};
    fresh.forEach(t => {
      if (!groups[t.catName]) groups[t.catName] = {name:t.catName, color:t.catColor, items:[]};
      groups[t.catName].items.push({text:t.text, carried:true});
    });
    Object.values(groups).forEach(g => {
      const match = categories.find(c => c.name.toLowerCase()===g.name.toLowerCase());
      if (match) match.tasks = [...g.items, ...match.tasks];
      else categories.unshift({name:g.name, id:'co_'+uid(), color:g.color, tasks:g.items});
    });
  }

  const d = loadAll();
  d[today] = { categories, done: [] };
  saveAll(d);
  renderBoard();
  show('board');
}

//  ADD MORE
// ──────────────────────────────────────────────
async function addMoreTasks() {
  const text = document.getElementById('add-more-input').value.trim();
  const apiKey = keyEl.value.trim() || loadAntKey();
  if (!text || !apiKey) return;
  const addBtn = document.getElementById('add-btn');
  addBtn.disabled = true; addBtn.textContent = '...';
  document.getElementById('add-error').classList.remove('visible');

  const result = await callClaude(apiKey, text);
  addBtn.textContent = 'ADD →';
  if (!result.ok) {
    addBtn.disabled = false;
    document.getElementById('add-error-msg').textContent = 'Failed to add tasks.';
    document.getElementById('add-error-detail').textContent = result.error;
    document.getElementById('add-error').classList.add('visible');
    return;
  }

  const days = loadAll(), day = days[today];
  if (!day) return;
  const existingTexts = new Set(day.categories.flatMap(c => c.tasks.map(t=>(typeof t==='string'?t:t.text).toLowerCase().trim())));

  result.categories.forEach(newCat => {
    const fresh = newCat.tasks.filter(t=>!existingTexts.has(t.toLowerCase().trim()))
      .map(t => { existingTexts.add(t.toLowerCase().trim()); return {text:t, carried:false}; });
    if (!fresh.length) return;
    const match = day.categories.find(c => c.name.toLowerCase()===newCat.name.toLowerCase());
    if (match) { match.tasks = [...match.tasks, ...fresh]; }
    else {
      const used = new Set(day.categories.map(c=>c.color));
      day.categories.push({name:newCat.name, id:'cx_'+uid(), color:COLORS.find(c=>!used.has(c))||COLORS[day.categories.length%COLORS.length], tasks:fresh});
    }
  });

  saveAll(days);
  document.getElementById('add-more-input').value = '';
  addBtn.disabled = true;
  renderBoard();
}

function addNewCategory() {
  const input = document.getElementById('new-cat-input');
  const name  = input.value.trim();
  if (!name) return;
  const days = loadAll(), day = days[today];
  if (!day) return;
  const used = new Set(day.categories.map(c=>c.color));
  day.categories.push({name, id:'cn_'+uid(), color:COLORS.find(c=>!used.has(c))||COLORS[day.categories.length%COLORS.length], tasks:[]});
  saveAll(days);
  input.value = '';
  renderBoard();
}

function deleteCategory(catId) {
  const days = loadAll(), day = days[today];
  if (!day) return;
  const cat = day.categories.find(c=>c.id===catId);
  if (!cat) return;
  if (cat.tasks.length > 0 && !confirm(`Delete "${cat.name}" and its ${cat.tasks.length} task${cat.tasks.length>1?'s':''}?`)) return;
  const doneSet = new Set(day.done||[]);
  cat.tasks.forEach((_,ti) => doneSet.delete(catId+'-'+ti));
  day.done = [...doneSet];
  day.categories = day.categories.filter(c=>c.id!==catId);
  saveAll(days);
  if (activeFilter === catId) activeFilter = null;
  renderBoard();
}

function startRename(catId) {
  const display = document.querySelector(`[data-cat-display="${catId}"]`);
  const input   = document.querySelector(`[data-cat-rename="${catId}"]`);
  if (!display || !input) return;
  display.classList.add('editing');
  input.classList.add('editing');
  input.focus(); input.select();
}

function commitRename(catId, newName) {
  const name = (newName||'').trim();
  if (!name) { cancelRename(catId); return; }
  const days = loadAll(), day = days[today];
  const cat  = day?.categories?.find(c=>c.id===catId);
  if (cat) { cat.name = name; saveAll(days); }
  renderBoard();
}

function cancelRename(catId) {
  const display = document.querySelector(`[data-cat-display="${catId}"]`);
  const input   = document.querySelector(`[data-cat-rename="${catId}"]`);
  if (display) display.classList.remove('editing');
  if (input)   input.classList.remove('editing');
}

function deleteTask(catId, taskIdx) {
  const days = loadAll(), day = days[today];
  const cat  = day?.categories?.find(c=>c.id===catId);
  if (!cat) return;
  const doneSet = new Set(day.done||[]), newDone = [];
  doneSet.forEach(key => {
    const [kCat, kIdx] = key.split('-'); const ki = parseInt(kIdx);
    if (kCat !== catId) { newDone.push(key); return; }
    if (ki < taskIdx) newDone.push(key);
    if (ki > taskIdx) newDone.push(kCat+'-'+(ki-1));
  });
  day.done = newDone;
  cat.tasks.splice(taskIdx, 1);
  saveAll(days);
  renderBoard();
}

// ──────────────────────────────────────────────
//  DRAG & DROP
// ──────────────────────────────────────────────
function onDragStart(e, catId, taskIdx) {
  dragState = { catId, taskIdx };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
  setTimeout(() => { const card = e.target.closest('.task-card'); if (card) card.classList.add('dragging'); }, 0);
}

function onDragEnd() {
  stopAutoScroll();
  document.querySelectorAll('.task-card.dragging').forEach(c=>c.classList.remove('dragging'));
  document.querySelectorAll('.cat-section.drag-over').forEach(c=>c.classList.remove('drag-over'));
  dragState = null;
}

function onDragOver(e, catId) {
  if (!dragState) return;
  e.preventDefault();
  lastClientY = e.clientY;
  startAutoScroll(e.clientY);
  document.querySelectorAll('.cat-section.drag-over').forEach(c=>c.classList.remove('drag-over'));
  const sec = document.querySelector(`[data-cat-section="${catId}"]`);
  if (sec) sec.classList.add('drag-over');
}

function onDrop(e, toCatId) {
  e.preventDefault();
  document.querySelectorAll('.cat-section.drag-over').forEach(c=>c.classList.remove('drag-over'));
  if (!dragState) return;
  const { catId: fromCatId, taskIdx } = dragState;
  if (fromCatId === toCatId) return;
  const days = loadAll(), day = days[today];
  if (!day) return;
  const fromCat = day.categories.find(c=>c.id===fromCatId);
  const toCat   = day.categories.find(c=>c.id===toCatId);
  if (!fromCat || !toCat) return;
  const task    = fromCat.tasks[taskIdx];
  if (!task) return;
  const doneSet = new Set(day.done||[]);
  const oldKey  = fromCatId+'-'+taskIdx;
  const wasDone = doneSet.has(oldKey);
  const newFromDone = [];
  doneSet.forEach(key => {
    const [kCat, kIdx] = key.split('-'); const ki = parseInt(kIdx);
    if (kCat !== fromCatId) { newFromDone.push(key); return; }
    if (ki < taskIdx) newFromDone.push(key);
    if (ki > taskIdx) newFromDone.push(kCat+'-'+(ki-1));
  });
  fromCat.tasks.splice(taskIdx, 1);
  const newTaskIdx = toCat.tasks.length;
  toCat.tasks.push(task);
  const finalDone = new Set(newFromDone);
  if (wasDone) finalDone.add(toCatId+'-'+newTaskIdx);
  day.done = [...finalDone];
  saveAll(days);
  renderBoard();
  dragState = null;
}

// ──────────────────────────────────────────────
//  AUTO SCROLL
// ──────────────────────────────────────────────
const SCROLL_ZONE = 120, SCROLL_SPEED = 14;
let scrollRaf = null, lastClientY = 0;

function startAutoScroll(clientY) {
  lastClientY = clientY;
  if (scrollRaf) return;
  function frame() {
    const vh = window.innerHeight, y = lastClientY;
    if (y < SCROLL_ZONE)             window.scrollBy(0, -SCROLL_SPEED * Math.pow(1-y/SCROLL_ZONE,1.5) * 2.5);
    else if (y > vh - SCROLL_ZONE)   window.scrollBy(0,  SCROLL_SPEED * Math.pow(1-(vh-y)/SCROLL_ZONE,1.5) * 2.5);
    scrollRaf = requestAnimationFrame(frame);
  }
  scrollRaf = requestAnimationFrame(frame);
}
function stopAutoScroll() {
  if (scrollRaf) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
}

// Touch drag
let touchDragState = null, touchGhost = null;
function onTouchStart(e, catId, taskIdx) {
  const card = e.currentTarget, rect = card.getBoundingClientRect(), touch = e.touches[0];
  touchDragState = { catId, taskIdx, offsetX: touch.clientX-rect.left, offsetY: touch.clientY-rect.top };
  touchGhost = card.cloneNode(true);
  touchGhost.classList.add('drag-ghost');
  touchGhost.style.cssText += `width:${rect.width}px;position:fixed;z-index:9999;left:${touch.clientX-touchDragState.offsetX}px;top:${touch.clientY-touchDragState.offsetY}px`;
  document.body.appendChild(touchGhost);
  card.classList.add('dragging');
  e.preventDefault();
}
function onTouchMove(e) {
  if (!touchDragState || !touchGhost) return;
  e.preventDefault();
  const touch = e.touches[0];
  lastClientY = touch.clientY;
  startAutoScroll(touch.clientY);
  touchGhost.style.left = (touch.clientX - touchDragState.offsetX) + 'px';
  touchGhost.style.top  = (touch.clientY - touchDragState.offsetY) + 'px';
  touchGhost.style.display = 'none';
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  touchGhost.style.display = '';
  document.querySelectorAll('.cat-section.drag-over').forEach(c=>c.classList.remove('drag-over'));
  if (el) { const sec = el.closest('[data-cat-section]'); if (sec) sec.classList.add('drag-over'); }
}
function onTouchEnd(e) {
  if (!touchDragState) return;
  stopAutoScroll();
  const touch = e.changedTouches[0];
  if (touchGhost) touchGhost.style.display = 'none';
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  if (touchGhost) { touchGhost.remove(); touchGhost = null; }
  document.querySelectorAll('.task-card.dragging').forEach(c=>c.classList.remove('dragging'));
  document.querySelectorAll('.cat-section.drag-over').forEach(c=>c.classList.remove('drag-over'));
  if (el) {
    const sec = el.closest('[data-cat-section]');
    const toCatId = sec?.dataset?.catSection;
    if (toCatId && toCatId !== touchDragState.catId) { dragState = touchDragState; onDrop({preventDefault:()=>{}}, toCatId); }
  }
  touchDragState = null;
}
document.addEventListener('touchmove', onTouchMove, {passive:false});
document.addEventListener('touchend', onTouchEnd);
document.addEventListener('dragover', (e) => { if (dragState) startAutoScroll(e.clientY); });

//  BOARD RENDER
// ──────────────────────────────────────────────
function renderBoard() {
  const days = loadAll(), day = days[today];
  if (!day) return;

  document.getElementById('board-date-label').innerHTML =
    `<span class="today-tag">TODAY</span><span style="color:var(--dim);font-size:12px;font-family:'IBM Plex Mono',monospace">${fmtDate(today)}</span>`;

  const coCount = (day.categories||[]).flatMap(c=>c.tasks).filter(t=>t.carried).length;
  document.getElementById('board-meta').textContent = coCount > 0 ? `↩ ${coCount} carried over` : '';

  const wrap     = document.getElementById('board-content');
  wrap.innerHTML = '';

  // Filter pills
  const pillWrap = document.getElementById('filter-pills');
  pillWrap.innerHTML = '';
  const allPill = mkPillEl('ALL', !activeFilter, '#F0F0F0', ()=>{ activeFilter=null; renderBoard(); });
  pillWrap.appendChild(allPill);
  (day.categories||[]).forEach(cat => {
    pillWrap.appendChild(mkPillEl(cat.name.toUpperCase(), activeFilter===cat.id, cat.color, ()=>{
      activeFilter = activeFilter===cat.id ? null : cat.id; renderBoard();
    }));
  });

  const catsToShow = activeFilter ? (day.categories||[]).filter(c=>c.id===activeFilter) : (day.categories||[]);
  catsToShow.forEach((cat, ci) => {
    const doneSet = new Set(day.done||[]);
    const catDone = cat.tasks.filter((_,ti)=>doneSet.has(cat.id+'-'+ti)).length;

    const sec = document.createElement('div');
    sec.className = 'cat-section';
    sec.dataset.catSection = cat.id;
    sec.setAttribute('ondragover', `event.preventDefault();onDragOver(event,'${cat.id}')`);
    sec.setAttribute('ondrop', `onDrop(event,'${cat.id}')`);

    const hdr = document.createElement('div');
    hdr.className = 'cat-header';
    hdr.innerHTML = `
      <div class="cat-dot" style="background:${cat.color}" onclick="toggleColorPicker('${cat.id}',this)" title="Change color"></div>
      <span class="cat-name-display" data-cat-display="${cat.id}" style="color:${cat.color}" ondblclick="startRename('${cat.id}')" title="Double-click to rename">${esc(cat.name.toUpperCase())}</span>
      <input class="cat-name-input" data-cat-rename="${cat.id}" style="color:${cat.color};border-color:${cat.color}" value="${esc(cat.name)}"
        onblur="commitRename('${cat.id}',this.value)"
        onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape')cancelRename('${cat.id}')" />
      <span class="cat-count">${catDone}/${cat.tasks.length}</span>
      <div class="cat-actions">
        <button class="cat-action-btn" onclick="startRename('${cat.id}')" title="Rename">✏️</button>
        <button class="cat-action-btn delete-cat" onclick="deleteCategory('${cat.id}')" title="Delete">🗑</button>
      </div>`;
    sec.appendChild(hdr);

    const list = document.createElement('div');
    list.className = 'task-list';
    const hint = document.createElement('div');
    hint.className = 'drop-hint';
    hint.textContent = 'drop here';
    list.appendChild(hint);

    cat.tasks.forEach((t, ti) => {
      const text    = typeof t==='string'?t:t.text;
      const carried = typeof t==='object' && t.carried;
      const key     = cat.id+'-'+ti;
      const isDone  = doneSet.has(key);

      const card = document.createElement('div');
      card.className = 'task-card'+(isDone?' done':'')+(carried?' carried':'');
      card.style.animationDelay = (ci*0.05+ti*0.03)+'s';
      card.draggable = true;
      card.innerHTML = `
        <span class="drag-handle" title="Drag to move">⠿</span>
        <div class="checkbox ${isDone?'checked':''}" style="border-color:${cat.color};background:${isDone?cat.color:'transparent'};color:#0C0C0F">${isDone?'✓':''}</div>
        <span class="task-text">${esc(text)}${carried?'<span class="carried-tag">↩</span>':''}</span>
        <button class="task-delete" onclick="event.stopPropagation();deleteTask('${cat.id}',${ti})">✕</button>`;

      // Checkbox — in-place update
      card.querySelector('.checkbox').addEventListener('click', (e) => {
        e.stopPropagation();
        const d2 = loadAll(), day2 = d2[today], ds2 = new Set(day2.done||[]);
        const nowDone = !ds2.has(key);
        nowDone ? ds2.add(key) : ds2.delete(key);
        day2.done = [...ds2];
        saveAll(d2);
        const cb = card.querySelector('.checkbox'), txt = card.querySelector('.task-text');
        if (nowDone) {
          cb.classList.add('checked'); cb.innerHTML = '✓'; cb.style.background = cat.color;
          cb.style.animation = 'checkmark-pop 0.25s cubic-bezier(0.34,1.56,0.64,1) forwards';
          card.classList.add('done'); txt.style.animation = 'task-complete 0.4s ease 0.1s forwards';
          burstParticles(cb, cat.color);
        } else {
          cb.classList.remove('checked'); cb.innerHTML = ''; cb.style.background = 'transparent';
          cb.style.animation = 'uncheck-pop 0.2s ease forwards';
          card.classList.remove('done'); txt.style.animation = ''; txt.style.opacity = '';
        }
        setTimeout(() => { cb.style.animation = ''; }, 400);
        updateProgress(day2);
        if (nowDone) {
          const d3 = loadAll(), day3 = d3[today];
          const thisCat = day3?.categories?.find(c=>c.id===cat.id);
          if (thisCat) {
            const ds3 = new Set(day3.done||[]);
            if (thisCat.tasks.every((_,ti2) => ds3.has(cat.id+'-'+ti2)))
              setTimeout(() => categoryCelebration(cat.id, cat.color), 320);
          }
        }
      });

      card.addEventListener('dragstart',  (e) => onDragStart(e, cat.id, ti));
      card.addEventListener('dragend',    onDragEnd);
      card.addEventListener('touchstart', (e) => onTouchStart(e, cat.id, ti), {passive:false});
      list.appendChild(card);
    });

    sec.appendChild(list);
    wrap.appendChild(sec);
  });

  updateProgress(day);
}

function updateProgress(day) {
  const doneSet = new Set(day.done||[]);
  const total   = (day.categories||[]).reduce((s,c)=>s+c.tasks.length,0);
  const n       = doneSet.size;
  document.getElementById('progress-fill').style.width = (total?n/total*100:0)+'%';
  document.getElementById('progress-label').textContent = n+' / '+total+' done';
  const b = document.getElementById('done-banner');
  (n===total&&total>0) ? b.classList.add('visible') : b.classList.remove('visible');
}

function mkPillEl(label, active, color, onclick) {
  const b = document.createElement('button');
  b.className = 'pill'; b.textContent = label; b.onclick = onclick;
  b.style.borderColor = color;
  b.style.color       = active ? '#0C0C0F' : color;
  b.style.background  = active ? color : 'transparent';
  return b;
}

// ──────────────────────────────────────────────
//  HISTORY
// ──────────────────────────────────────────────
function showHistory() {
  const days = loadAll(), keys = Object.keys(days).sort().reverse();
  const wrap = document.getElementById('history-content');
  wrap.innerHTML = '';
  if (!keys.length) { wrap.innerHTML = '<p class="no-history">No history yet.</p>'; }
  else keys.forEach(dk => {
    const day     = days[dk], doneSet = new Set(day.done||[]);
    const total   = (day.categories||[]).reduce((s,c)=>s+c.tasks.length,0);
    const entry   = document.createElement('div');
    entry.className = 'day-entry';
    entry.innerHTML = `
      <div class="day-entry-head">
        <span class="day-entry-date">${dk===today?'📌 ':''} ${fmtDate(dk)}${dk===today?' <span style="color:var(--teal);font-size:10px">TODAY</span>':''}</span>
        <span class="day-entry-stats">${doneSet.size}/${total} done</span>
      </div>
      <div id="dtl-${dk}"></div>`;
    wrap.appendChild(entry);
    const list = document.getElementById('dtl-'+dk);
    (day.categories||[]).forEach(cat => {
      cat.tasks.forEach((t,ti) => {
        const text = typeof t==='string'?t:t.text, isDone = doneSet.has(cat.id+'-'+ti);
        const row  = document.createElement('div');
        row.className = 'day-task'+(isDone?' done-task':'');
        row.innerHTML = `<div class="dt-dot" style="background:${isDone?cat.color:'var(--border)'}"></div><span>${esc(text)}</span>`;
        list.appendChild(row);
      });
    });
  });
  show('history');
}

// ──────────────────────────────────────────────
//  CLAUDE API
// ──────────────────────────────────────────────
async function callClaude(apiKey, text) {
  const mel = document.getElementById('load-msg');
  let mi=0; const iv=setInterval(()=>{ mi=(mi+1)%MSGS.length; if(mel) mel.textContent=MSGS[mi]; },1400);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,messages:[{role:'user',content:`Extract tasks from the text below. Rules:\n- Keep each task EXACTLY as written — do NOT break tasks into sub-steps, do NOT expand or elaborate\n- One task in = one task out. Never split one task into multiple tasks.\n- Deduplicate only if two tasks say the exact same thing\n- Group into 2-7 categories with short 2-3 word names\n- Each task under 90 chars (trim only if too long)\n- Return ONLY raw JSON, no markdown, no explanation\n\nFormat: {"categories":[{"name":"Name","tasks":["task"]}]}\n\nText:\n${text}`}]})
    });
    clearInterval(iv);
    if (!res.ok) { const t=await res.text().catch(()=>''); return {ok:false,error:`HTTP ${res.status} — ${t.slice(0,200)}`}; }
    const data    = await res.json();
    const raw     = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const cleaned = raw.replace(/^```json\s*/,'').replace(/\s*```$/,'').trim();
    let parsed;
    try { parsed = JSON.parse(cleaned); } catch(e) { return {ok:false,error:'JSON parse failed: '+cleaned.slice(0,200)}; }
    if (!parsed.categories?.length) return {ok:false,error:'No categories returned.'};
    return {ok:true,categories:parsed.categories};
  } catch(e) { clearInterval(iv); return {ok:false,error:e.message}; }
}

// ──────────────────────────────────────────────
//  PARTICLES
// ──────────────────────────────────────────────
function burstParticles(anchor, color) {
  const rect = anchor.getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  const CLR = [color,'#FFE66D','#fff',color,'#fff',color,'#FFE66D'];
  for (let i=0;i<16;i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 5+Math.random()*7, angle=(Math.PI*2*i/16)+(Math.random()-0.5)*0.9;
    const dist = 50+Math.random()*65, dur = 0.9+Math.random()*0.5;
    p.style.cssText=`width:${size}px;height:${size}px;background:${CLR[i%CLR.length]};left:${cx-size/2}px;top:${cy-size/2}px;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;animation-duration:${dur}s;animation-delay:${Math.random()*0.08}s`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),(dur+0.1)*1000+80);
  }
}

function categoryCelebration(catId, color) {
  const sec = document.querySelector(`[data-cat-section="${catId}"]`);
  const hdr = sec?.querySelector('.cat-header');
  if (!hdr) return;
  hdr.style.setProperty('--glow-color', color+'88');
  hdr.style.setProperty('--flash-color', color+'22');
  hdr.style.animation = 'cat-complete-glow 0.9s ease forwards';
  setTimeout(()=>{ hdr.style.animation=''; },1000);
  const label = hdr.querySelector('.cat-name-display');
  if (label) { label.style.animation='cat-label-pop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards'; setTimeout(()=>{ label.style.animation=''; },500); }
  const badge = document.createElement('div');
  badge.textContent = '✓ ALL DONE';
  const rect = hdr.getBoundingClientRect();
  badge.style.cssText = `position:fixed;z-index:9999;pointer-events:none;font-family:'Archivo Black',sans-serif;font-size:12px;letter-spacing:0.1em;color:${color};background:${color}18;border:1.5px solid ${color}66;padding:5px 14px;border-radius:20px;left:${rect.left+rect.width/2-50}px;top:${rect.top-10}px;animation:badge-rise 1.4s ease forwards`;
  const style = document.createElement('style');
  style.textContent='@keyframes badge-rise{0%{transform:translateY(0) scale(0.7);opacity:0}20%{transform:translateY(-8px) scale(1.05);opacity:1}70%{opacity:1}100%{transform:translateY(-52px) scale(0.9);opacity:0}}';
  document.head.appendChild(style); document.body.appendChild(badge);
  setTimeout(()=>{ badge.remove(); style.remove(); },1500);
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for (let i=0;i<20;i++) {
    const p=document.createElement('div'), isStreak=i%3!==0;
    const w=isStreak?(3+Math.random()*3):(6+Math.random()*6), h=isStreak?(12+Math.random()*14):w;
    const angle=(Math.PI*2*i/20)+(Math.random()-0.5), dist=70+Math.random()*90, dur=1+Math.random()*0.6;
    const CLR=[color,color,'#FFE66D','#fff',color,'#FFE66D','#fff'];
    p.style.cssText=`position:fixed;pointer-events:none;z-index:9999;width:${w}px;height:${h}px;background:${CLR[i%CLR.length]};border-radius:${isStreak?'3px':'50%'};left:${cx-w/2}px;top:${cy-h/2}px;transform-origin:center;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;animation:streak-fly ${dur}s cubic-bezier(0.2,0.8,0.4,1) ${Math.random()*0.1}s forwards`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),(dur+0.2)*1000);
  }
}

// ──────────────────────────────────────────────
//  UTILS
// ──────────────────────────────────────────────
function show(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}
function showInputError(detail) {
  show('input');
  document.getElementById('input-error-msg').textContent = 'Failed to parse tasks.';
  document.getElementById('input-error-detail').textContent = detail||'';
  document.getElementById('input-error').classList.add('visible');
}
function uid() { return Math.random().toString(36).slice(2,8); }
function esc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
